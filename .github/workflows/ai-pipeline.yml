name: AI delivery pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same apt set proven by upstream .github/workflows/test.yml (cargo test on ubuntu-24.04)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers libx11-dev libxtst-dev libxrandr-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run project checks
        shell: bash
        run: ./.ai-pipeline/ci.sh

  human-approval:
    name: Human approval
    needs: ci
    runs-on: ubuntu-latest
    environment: human-approval
    steps:
      - run: echo 'Human approval granted after CI.'

  pipeline-complete:
    name: Pipeline complete
    needs: human-approval
    runs-on: ubuntu-latest
    steps:
      - run: echo 'PIPELINE_GATE=PASS' >> "$GITHUB_ENV"
